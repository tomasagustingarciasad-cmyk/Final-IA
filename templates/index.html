<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Piezas</title>
    <style>
        :root {
            --bg-color: #121212;
            --primary-color: #1e1e1e;
            --secondary-color: #2a2a2a;
            --accent-color: #03dac6;
            --text-color: #e0e0e0;
            --error-color: #cf6679;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            color: var(--accent-color);
            font-weight: 300;
        }
        .card {
            background-color: var(--primary-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .button-group {
            display: flex;
            gap: 1rem;
        }
        button {
            flex-grow: 1;
            padding: 1rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--bg-color);
            background-color: var(--accent-color);
        }
        button:active {
            transform: scale(0.95);
        }
        button.is-recording {
            background-color: var(--error-color);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(207, 102, 121, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(207, 102, 121, 0); }
            100% { box-shadow: 0 0 0 0 rgba(207, 102, 121, 0); }
        }
        .result-box {
            background-color: var(--secondary-color);
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            min-height: 2em;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
        }
        .result-box-title {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }
        #historial-lista {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            padding: 0;
            list-style: none;
        }
        #historial-lista li {
            background-color: #333;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.9rem;
        }
        #status-log {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            margin-top: 1rem;
            min-height: 1em;
        }
        /* Hidden file input */
        #image-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Clasificador IA</h1>

        <!-- Sección de Clasificación de Imagen -->
        <div class="card">
            <div class="button-group">
                <button id="capture-image-btn">📸 Sacar Foto</button>
            </div>
            <input type="file" id="image-input" accept="image/*" capture="environment">
            
            <div class="result-box">
                <div class="result-box-title">Última Pieza</div>
                <span id="image-prediction">---</span>
            </div>
        </div>

        <!-- Sección de Comandos de Voz -->
        <div class="card">
            <div class="button-group">
                <button id="record-command-btn">🎤 Grabar Comando</button>
            </div>
            <div class="result-box">
                <div class="result-box-title">Resultado del Comando</div>
                <span id="command-result">---</span>
            </div>
        </div>

        <!-- Sección de Historial -->
        <div class="card">
            <h2>Historial (últimas 10)</h2>
            <div id="historial-lista">
                <!-- El historial se llenará aquí -->
            </div>
        </div>

        <div id="status-log">Listo.</div>
    </div>

    <script>
        // --- Elementos del DOM ---
        const captureImageBtn = document.getElementById('capture-image-btn');
        const imageInput = document.getElementById('image-input');
        const recordCommandBtn = document.getElementById('record-command-btn');
        
        const imagePredictionEl = document.getElementById('image-prediction');
        const commandResultEl = document.getElementById('command-result');
        const historialListaEl = document.getElementById('historial-lista');
        const statusLogEl = document.getElementById('status-log');

        // --- Lógica de Imagen ---
        captureImageBtn.addEventListener('click', () => {
            imageInput.click(); // Abre la cámara del celular
        });

        imageInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            logStatus('Enviando imagen...');
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/predict_image', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Error del servidor: ${response.status}`);
                }

                const data = await response.json();
                imagePredictionEl.textContent = data.prediccion;
                updateHistorial(data.historial);
                logStatus(`Predicción: ${data.prediccion}`);

            } catch (error) {
                logStatus(`Error: ${error.message}`, true);
            }
        });

        // --- Lógica de Audio ---
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        recordCommandBtn.addEventListener('click', async () => {
            if (isRecording) {
                mediaRecorder.stop();
                recordCommandBtn.classList.remove('is-recording');
                recordCommandBtn.textContent = '🎤 Grabar Comando';
                logStatus('Procesando audio...');
                isRecording = false;
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    
                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = sendAudioToServer;

                    audioChunks = [];
                    mediaRecorder.start();
                    recordCommandBtn.classList.add('is-recording');
                    recordCommandBtn.textContent = '🛑 Detener';
                    logStatus('Grabando... habla ahora.');
                    isRecording = true;

                } catch (error) {
                    logStatus('Error al acceder al micrófono.', true);
                    console.error("Error al obtener media:", error);
                }
            }
        });

        async function sendAudioToServer() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' }); // El formato puede variar
            const audioFile = new File([audioBlob], "command.webm", { type: audioBlob.type });

            const formData = new FormData();
            formData.append('file', audioFile);

            try {
                const response = await fetch('/predict_command', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Error del servidor: ${response.status}`);
                }

                const data = await response.json();
                commandResultEl.textContent = data.resultado_accion;
                logStatus(`Comando: ${data.comando_detectado}`);

            } catch (error) {
                logStatus(`Error: ${error.message}`, true);
            }
        }

        // --- Funciones de Utilidad ---
        function logStatus(message, isError = false) {
            statusLogEl.textContent = message;
            statusLogEl.style.color = isError ? 'var(--error-color)' : '#888';
        }

        function updateHistorial(historial) {
            historialListaEl.innerHTML = ''; // Limpiar lista
            historial.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                historialListaEl.appendChild(li);
            });
        }
    </script>

</body>
</html>
